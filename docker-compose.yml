# Local only. Never use an Azure DATABASE_URL in this Compose project.
name: zyvalentine-local
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zy_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD}
      POSTGRES_DB: zyvalentine
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zy_local -d zyvalentine"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://zy_local:${POSTGRES_PASSWORD}@db:5432/zyvalentine
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      DB_SSL_MODE: disable
      WEB_CONCURRENCY: 1
      APP_REPLICAS: 1
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Local: sin proveedor de pagos, correo a consola y fotos en un volumen propio.
      PAYMENT_PROVIDER: none
      MAIL_BACKEND: console
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/photos
    volumes:
      - local_photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
# No migration is run automatically on container/API startup.
volumes:
  local_pg_data:
  local_photos:
